*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9e5de;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
html[data-x="1"],html[data-x="1"] body{background:#080b11}
#app{position:absolute!important;inset:auto!important;left:0;top:0;width:${di}px;height:${Gn}px;transform-origin:0 0;
  --ink:#211e1a;--dim:#6f685f;--mute:#a39b8f;--line:#ddd6ca;--panel:rgba(252,250,246,.9);--cell:#f1ede5;--acc:${Ii};
  font-family:'JetBrains Mono','PingFang SC','Microsoft YaHei',monospace;color:var(--ink)}
html[data-x="1"] #app{--ink:#e6edf7;--dim:#93a1b5;--mute:#5d6b80;--line:#232d3d;--panel:rgba(13,17,25,.86);--cell:#161d2a}
#gl{touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.ui{position:absolute;inset:0;pointer-events:none}
.ui *{box-sizing:border-box}
.hd{position:absolute;left:36px;top:30px}
.tag{font:700 11px 'JetBrains Mono',monospace;letter-spacing:2.4px;color:var(--acc)}
.h1{margin-top:8px;font:800 40px/1 Inter,'PingFang SC',sans-serif;letter-spacing:-.5px;color:var(--ink)}
.h2{margin-top:10px;font-size:12.5px;letter-spacing:.4px;color:var(--dim)}
.pn{position:absolute;width:300px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);backdrop-filter:blur(8px);pointer-events:auto}
.pt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font:700 11px 'JetBrains Mono','PingFang SC',monospace;letter-spacing:1.8px;color:var(--dim)}
.pt b{font-weight:600;color:var(--mute);letter-spacing:.6px}
.kr{display:flex;align-items:center;height:27px;padding:0 8px;border-radius:5px;font-size:12.5px;cursor:pointer}
.kr:hover{background:var(--cell)}
.kr i{width:22px;font-style:normal;color:var(--mute);text-align:center;margin-right:8px}
.kr span{flex:1}
.kr em{font-style:normal;color:var(--dim);max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kr.on{background:var(--acc);color:#fff}
.kr.on i,.kr.on em{color:#fff}
.mp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.mp div{padding:8px 4px 9px;border-radius:6px;background:var(--cell);text-align:center;min-width:0}
.mp small{display:block;font-size:10.5px;color:var(--mute);margin-bottom:5px}
.mp b{display:block;font:700 12.5px Inter,'PingFang SC',sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp b.ns{font-weight:500;color:var(--mute)}
.rd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rd div{padding:9px 10px;border-radius:6px;background:var(--cell)}
.rd small{display:block;font-size:10.5px;color:var(--mute);margin-bottom:5px}
.rd b{font:700 19px 'JetBrains Mono',monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.rd b u{text-decoration:none;font-size:11px;font-weight:600;color:var(--dim);margin-left:3px}
.ch{display:flex;gap:4px;margin-top:10px}
.ch div{flex:1;padding:7px 0 8px;border-radius:5px;background:var(--cell);text-align:center;font-size:10.5px;color:var(--mute);transition:background .12s,color .12s}
.ch div.on{background:var(--acc);color:#fff}
.nt{margin-top:8px;font-size:10.5px;line-height:1.5;color:var(--mute)}
.br{display:flex;align-items:center;gap:9px;height:36px;padding:0 8px;border-radius:5px;cursor:pointer}
.br:hover{background:var(--cell)}
.br.on{background:var(--cell);box-shadow:inset 2px 0 0 var(--acc)}
.br i{flex:none;width:9px;height:9px;border-radius:2px}
.br span{flex:1;min-width:0}
.br b{display:block;font:700 12.5px Inter,'PingFang SC',sans-serif;color:var(--ink)}
.br small{display:block;font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(8px);pointer-events:auto;white-space:nowrap}
.sg{display:flex;gap:3px}
.bt{height:32px;padding:0 13px;border:0;border-radius:7px;background:transparent;color:var(--dim);font:600 12.5px 'JetBrains Mono','PingFang SC',monospace;cursor:pointer}
.bt:hover{background:var(--cell)}
.bt.on{background:var(--ink);color:var(--panel)}
html[data-x="1"] .bt.on{color:#0b0e14}
.bt.acc.on{background:var(--acc);color:#fff}
.sep{width:1px;height:22px;background:var(--line)}
.sl{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim)}
.sl input{width:150px;accent-color:${Ii};cursor:ew-resize}
.sl b{width:38px;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip{position:absolute;left:50%;top:34px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:28px;padding:0 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font:700 11px 'JetBrains Mono','PingFang SC',monospace;letter-spacing:1.2px;color:var(--ink);cursor:pointer;pointer-events:auto;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.chip.on i{background:var(--acc);animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:10.5px;letter-spacing:1px;color:var(--mute);white-space:nowrap}
.co{position:absolute;left:0;top:0;white-space:nowrap;padding-left:10px;border-left:2px solid var(--acc)}
.co b{display:block;font:700 13px Inter,'PingFang SC',sans-serif;color:var(--ink)}
.co small{display:block;margin-top:2px;font-size:10.5px;color:var(--dim)}
svg.ld{position:absolute;inset:0;width:${di}px;height:${Gn}px;overflow:visible}
svg.ld path{fill:none;stroke:var(--mute);stroke-width:1}
svg.ld circle{fill:var(--acc)}
 .stage-space,.mobile-tabs{display:none}
@media (max-width:700px) and (orientation:portrait) {
  html,body{height:100%;overflow:hidden}
  #app{position:relative!important;inset:auto!important;width:100%!important;height:100dvh!important;transform:none!important;overflow:hidden}
  #gl{top:76px;left:0;width:100%;height:calc(100dvh - 240px)}
  .ui{position:absolute;inset:0}
  .hd{left:16px;top:max(12px,env(safe-area-inset-top))}
  .tag{font-size:9px;letter-spacing:1px}.h1{font-size:24px;margin-top:4px}.h2{font-size:10px;margin-top:4px}
  .chip{top:76px;left:auto;right:12px;transform:none;height:32px;font-size:9px;letter-spacing:0;padding:0 8px}
  .bar{left:10px;right:10px;bottom:calc(52px + env(safe-area-inset-bottom));transform:none;display:flex;flex-wrap:wrap;gap:4px;padding:7px;white-space:normal}
  .views{width:100%;justify-content:space-between}.bt{height:38px;padding:0 9px;font-size:12px}
  .bar .sep{display:none}.sl{flex:1;min-width:120px}.sl input{width:100%;min-width:50px}
  .mobile-tabs{display:flex;position:absolute;left:10px;right:10px;bottom:env(safe-area-inset-bottom);height:48px;gap:6px;pointer-events:auto}
  .mobile-tabs button{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:600 13px 'PingFang SC',sans-serif}
  .mobile-tabs button[aria-expanded="true"]{background:var(--ink);color:var(--panel)}
  .pn{display:none;position:absolute;left:10px!important;right:10px!important;top:auto!important;bottom:calc(160px + env(safe-area-inset-bottom));width:auto;max-height:45dvh;overflow:auto;padding:14px}
  .pn.mobile-open{display:block}.kr{height:40px;font-size:13px}.br{height:44px}
  .hint{display:none} svg.ld,.cos{display:none}
}
